name: CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install OpenResty and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl gnupg cpanminus build-essential lua-check
          curl -fsSL --retry 3 https://openresty.org/package/pubkey.gpg \
            | gpg --dearmor > "$RUNNER_TEMP/openresty.gpg"
          sudo install -m 644 "$RUNNER_TEMP/openresty.gpg" /usr/share/keyrings/openresty.gpg
          echo "deb [signed-by=/usr/share/keyrings/openresty.gpg] https://openresty.org/package/ubuntu noble main" \
            | sudo tee /etc/apt/sources.list.d/openresty.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openresty
          sudo cpanm --notest --mirror https://cpan.metacpan.org --mirror-only Test::Nginx

      - name: Lint Lua modules
        run: luacheck lib

      - name: Run all regressions
        env:
          TEST_NGINX_BINARY: /usr/local/openresty/nginx/sbin/nginx
        run: |
          "$TEST_NGINX_BINARY" -V
          prove -r t/

      - name: Save nginx diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nginx-test-logs
          path: t/servroot/logs/
